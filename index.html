<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výber strednej školy - Mapa</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .leaflet-control-attribution a:first-child {
            display: none; 
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Definovanie hraničného obdĺžnika pre Slovensko
        var slovakiaBounds = [
            [47.7, 16.8], 
            [49.6, 22.6]
        ];

        // 2. Inicializácia mapy s obmedzeniami na Slovensko
        var map = L.map('map', {
            center: [48.6690, 19.6990],
            zoom: 8,
            minZoom: 8,
            maxZoom: 16,
            maxBounds: slovakiaBounds,
            maxBoundsViscosity: 1.0
        });

        // 3. Zmena na Esri Light Gray Canvas (čistý dizajn, bez API kľúča)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        // Ukážka pridania značky pre strednú školu
        var schoolMarker = L.circleMarker([48.73, 19.14], {
            color: '#2563eb',
            fillColor: '#3b82f6',
            fillOpacity: 0.8,
            radius: 8
        }).addTo(map);
        
        schoolMarker.bindPopup("<b>Gymnázium Ukážkové</b><br>Zameranie: Informatika");
    </script>

</body>
</html>
