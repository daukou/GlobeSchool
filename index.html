<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výber strednej školy - Tmavá Mapa</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Tmavé pozadie pre plynulé načítanie */
        }
        #map {
            width: 100%;
            height: 100vh;
            background-color: #1a1a1a; /* Tmavá farba pre prázdne miesta mapy */
        }
        .leaflet-control-attribution a:first-child {
            display: none; 
        }
        /* Tmavý štýl pre popup okná */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #2d2d2d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Definovanie hraničného obdĺžnika pre Slovensko
        var slovakiaBounds = [
            [47.7, 16.8], 
            [49.6, 22.6]
        ];

        // 2. Inicializácia mapy
        var map = L.map('map', {
            center: [48.6690, 19.6990],
            zoom: 8,
            minZoom: 8,
            maxZoom: 16,
            maxBounds: slovakiaBounds,
            maxBoundsViscosity: 1.0
        });

        // 3. Tmavý mapový podklad (Esri Dark Gray Canvas - bez API kľúča)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        // 4. Načítanie a vykreslenie obrysu Slovenska cez GeoJSON
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries/SVK.geo.json')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#3b82f6', // Jasná modrá pre obrys
                        weight: 3,        // Hrúbka čiary
                        opacity: 0.8,
                        fillColor: '#1e293b', // Mierne zafarbenie vnútra SR
                        fillOpacity: 0.3
                    }
                }).addTo(map);
            })
            .catch(err => console.error("Nepodarilo sa načítať obrys Slovenska: ", err));

        // 5. Ukážka pridania značky pre strednú školu v tmavom dizajne
        var schoolMarker = L.circleMarker([48.73, 19.14], {
            color: '#60a5fa',     // Svetlejší okraj pre kontrast v tme
            fillColor: '#3b82f6', // Výrazná modrá výplň
            fillOpacity: 0.9,
            radius: 8,
            weight: 2
        }).addTo(map);
