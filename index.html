<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výber strednej školy - Mapa a Panel</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            background-color: #121212;
        }

        /* --- BOČNÝ PANEL --- */
        #sidebar {
            width: 380px;
            min-width: 380px;
            background: #ffffff;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e5e7eb;
            z-index: 1000;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #f3f4f6;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
            margin-left: 15px;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .search-container {
            padding: 20px;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            background-color: #f3f4f6;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 20px 20px;
        }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            border: none;
            cursor: pointer;
            background: #f3f4f6;
            color: #4b5563;
        }
        .filter-btn.active {
            background: #3b82f6;
            color: white;
        }

        .school-list {
            flex-grow: 1;
        }
        .school-item {
            display: flex;
            padding: 15px 20px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: background 0.2s;
        }
        .school-item:hover {
            background: #f9fafb;
        }
        .school-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #e5e7eb;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .school-info {
            flex-grow: 1;
        }
        .school-type {
            font-size: 12px;
            color: #059669; /* Zelená pre odborné, modrá pre gymnáziá atď. */
            margin-bottom: 2px;
        }
        .school-name {
            font-size: 15px;
            font-weight: bold;
            color: #111827;
            margin: 0 0 5px 0;
        }
        .school-location {
            font-size: 13px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- MAPA --- */
        #map-container {
            flex-grow: 1;
            height: 100%;
            background-color: #1a1a1a;
        }
        .leaflet-control-attribution a:first-child { display: none; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #2d2d2d; color: #ffffff; }
    </style>
</head>
<body>

    <!-- BOČNÝ PANEL -->
    <div id="sidebar">
        <div class="header">
            <a href="#" class="back-btn">&larr; Späť</a>
            <div class="header-title">
                <span style="font-size: 24px;">🌍</span> GlobeSchool
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" placeholder="Hľadaj školu...">
        </div>

        <div class="filters">
            <button class="filter-btn active">Všetky</button>
            <button class="filter-btn">Gymnáziá</button>
            <button class="filter-btn">Tech. školy</button>
            <button class="filter-btn">Obch. školy</button>
            <button class="filter-btn">Odb. školy</button>
        </div>

        <div class="school-list">
            <!-- Škola 1 -->
            <div class="school-item" onclick="focusMap(48.7335, 21.2520)">
                <img src="https://via.placeholder.com/60" class="school-img" alt="SPŠE">
                <div class="school-info">
                    <div class="school-type" style="color: #059669;">Stredná odborná škola</div>
                    <h3 class="school-name">SPŠ elektrotechnická</h3>
                    <div class="school-location">📍 Komenského 44, Košice</div>
                </div>
            </div>

            <!-- Škola 2 -->
            <div class="school-item" onclick="focusMap(48.7042, 21.2465)">
                <img src="https://via.placeholder.com/60" class="school-img" alt="Ostrovského">
                <div class="school-info">
                    <div class="school-type" style="color: #059669;">Stredná odborná škola</div>
                    <h3 class="school-name">SOŠ IT Ostrovského</h3>
                    <div class="school-location">📍 Juh, Košice</div>
                </div>
            </div>

            <!-- Škola 3 -->
            <div class="school-item" onclick="focusMap(48.7188, 21.2592)">
                <img src="https://via.placeholder.com/60" class="school-img" alt="Futurum">
                <div class="school-info">
                    <div class="school-type" style="color: #d97706;">Súkromná SOŠ</div>
                    <h3 class="school-name">SSOŠ Futurum</h3>
                    <div class="school-location">📍 Grešákova 1, Košice</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAPA -->
    <div id="map-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var slovakiaBounds = [[47.7, 16.8], [49.6, 22.6]];

        // Inicializácia mapy (posunutá mierne na východ pre lepšie zobrazenie Košíc v deme)
        var map = L.map('map-container', {
            center: [48.72, 21.25], 
            zoom: 12,
            minZoom: 7,
            maxZoom: 16,
            maxBounds: slovakiaBounds,
            maxBoundsViscosity: 1.0
        });

        // Tmavý podklad
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        // Načítanie presnejšieho GeoJSON obrysu a nastavenie BIELEJ farby
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(response => response.json())
            .then(data => {
                // Vyfiltrovanie iba Slovenska z globálneho datasetu
                const slovakia = data.features.find(f => f.properties.ISO_A3 === 'SVK');
                
                L.geoJSON(slovakia, {
                    style: {
                        color: '#ffffff', // Biely obrys
                        weight: 2,        // Hrúbka čiary
                        opacity: 1,
                        fillColor: '#ffffff',
                        fillOpacity: 0.05 // Veľmi jemné presvetlenie vnútra
                    }
                }).addTo(map);
            })
            .catch(err => console.error("Chyba GeoJSON: ", err));

        // Markery pre Košice
        var schools = [
            { name: "SPŠ elektrotechnická", lat: 48.7335, lng: 21.2520, type: "Komenského 44" },
            { name: "SOŠ IT Ostrovského", lat: 48.7042, lng: 21.2465, type: "Ostrovského 1" },
            { name: "SSOŠ Futurum", lat: 48.7188, lng: 21.2592, type: "Grešákova 1" }
        ];

        schools.forEach(school => {
            var marker = L.circleMarker([school.lat, school.lng], {
                color: '#ffffff',     // Biely okraj pre viditeľnosť na tmavej mape
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 8,
                weight: 2
            }).addTo(map);
            
            marker.bindPopup(`<b>${school.name}</b><br>${school.type}`);
        });

        // Funkcia na prepojenie panelu s mapou
        function focusMap(lat, lng) {
            map.flyTo([lat, lng], 15, {
                animate: true,
                duration: 1.5
            });
        }
    </script>

</body>
</html>
